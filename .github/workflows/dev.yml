name: CI/CD - Development

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/lab5

jobs:

  test-user-service:
    name: Test | user-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./user-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: user-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  test-task-service:
    name: Test | task-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: task-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build & Push | :dev tag
    runs-on: ubuntu-latest
    needs: [test-user-service, test-task-service]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/user-service:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push task-service
        uses: docker/build-push-action@v5
        with:
          context: ./task-service
          file: ./task-service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/task-service:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy | Development (simulated)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulate — connect to dev server
        run: |
          echo "Connecting to dev server..."
          echo " Host: dev.example.com"
          echo " User: deploy"

      - name: Simulate — pull latest images
        run: |
          echo "Pulling Docker images from ghcr.io..."
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/user-service:dev"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/task-service:dev"

      - name: Simulate — run docker compose up
        run: |
          echo "Deploying to DEV environment..."

      - name: Simulate — health checks
        run: |
          echo "Time:    $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
