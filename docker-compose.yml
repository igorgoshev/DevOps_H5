services:

  api-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - task-service
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      MONGO_URI: mongodb://mongodb:27017/users_db
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key}
    volumes:
      - ./user-service/src:/app/src
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  task-service:
    build:
      context: ./task-service
      dockerfile: Dockerfile.dev
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      MONGO_URI: mongodb://mongodb:27017/tasks_db
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key}
    volumes:
      - ./task-service/src:/app/src
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_dev_data:
